<!DOCTYPE html>
<html>
<head>
    <title>Catch the Falling Stars</title>
    <style>
        body {
            margin: 0;
            background: #0f0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }

        canvas {
            border: 3px solid #444;
            background: #0f0f1e;
        }
    </style>
</head>

<body>

<canvas id="game" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

let basket = {
    x: WIDTH / 2 - 50,
    y: HEIGHT - 60,
    width: 100,
    height: 20,
    speed: 8
};

let star = {
    x: Math.random() * (WIDTH - 20),
    y: -20,
    size: 20,
    speed: 5
};

let score = 0;
let lives = 3;
let gameOver = false;

let keys = {};

document.addEventListener("keydown", function(event) {
    keys[event.key] = true;

    if (gameOver && event.key.toLowerCase() === "r") {
        restartGame();
    }

    if (gameOver && event.key.toLowerCase() === "q") {
        gameOver = false;
        score = 0;
        lives = 3;
        resetStar();
    }
});

document.addEventListener("keyup", function(event) {
    keys[event.key] = false;
});

function resetStar() {
    star.x = Math.random() * (WIDTH - star.size);
    star.y = -star.size;
    star.speed = 5 + score * 0.15;
}

function restartGame() {
    score = 0;
    lives = 3;
    gameOver = false;

    basket.x = WIDTH / 2 - basket.width / 2;

    resetStar();
}

function update() {

    if (gameOver) {
        return;
    }

    if (keys["ArrowLeft"]) {
        basket.x -= basket.speed;
    }

    if (keys["ArrowRight"]) {
        basket.x += basket.speed;
    }

    // Keep basket inside screen
    basket.x = Math.max(
        0,
        Math.min(WIDTH - basket.width, basket.x)
    );

    star.y += star.speed;

    // Collision detection
    if (
        star.x < basket.x + basket.width &&
        star.x + star.size > basket.x &&
        star.y < basket.y + basket.height &&
        star.y + star.size > basket.y
    ) {
        score++;
        resetStar();
    }

    // Star missed
    if (star.y > HEIGHT) {
        lives--;
        resetStar();

        if (lives <= 0) {
            gameOver = true;
        }
    }
}

function draw() {

    ctx.fillStyle = "#0f0f1e";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Basket
    ctx.fillStyle = "#3296ff";
    ctx.fillRect(
        basket.x,
        basket.y,
        basket.width,
        basket.height
    );

    // Star
    ctx.fillStyle = "#ffd700";

    ctx.beginPath();
    ctx.arc(
        star.x + star.size / 2,
        star.y + star.size / 2,
        star.size / 2,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Score
    ctx.fillStyle = "white";
    ctx.font = "28px Arial";
    ctx.fillText("Score: " + score, 20, 35);

    // Lives
    ctx.fillText(
        "Lives: " + lives,
        WIDTH - 120,
        35
    );

    // Game over screen
    if (gameOver) {

        ctx.fillStyle = "#ff5050";
        ctx.font = "65px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "GAME OVER",
            WIDTH / 2,
            230
        );

        ctx.fillStyle = "white";
        ctx.font = "30px Arial";

        ctx.fillText(
            "Final Score: " + score,
            WIDTH / 2,
            300
        );

        ctx.font = "24px Arial";

        ctx.fillText(
            "Press R to Restart",
            WIDTH / 2,
            360
        );

        ctx.fillText(
            "Press Q to Quit",
            WIDTH / 2,
            400
        );

        ctx.textAlign = "left";
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
